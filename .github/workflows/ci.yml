name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Named explicitly so lock drift reports itself instead of arriving later
      # as an inexplicable lint failure. #54 cost four blocked PRs and a full
      # diagnosis because the only symptom was "33 ruff errors on a PR that
      # touched no Python".
      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      # --frozen: install exactly what the lockfile pins. Without it `uv sync`
      # re-resolves whenever the lock cannot satisfy pyproject, silently giving
      # CI a different toolchain than every local run.
      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint (ruff)
        run: uv run --frozen ruff check awair/ tests/

      - name: Format check (ruff)
        run: uv run --frozen ruff format --check awair/ tests/

      - name: Run tests
        run: uv run --frozen pytest
