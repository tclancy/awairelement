version: 2
updates:
  # "uv", not "pip": the pip ecosystem edits pyproject.toml and leaves uv.lock
  # untouched, so every bump left the lock unable to satisfy its own pyproject
  # (verified on 7d1fc24, which moved the ruff floor and changed one file). CI's
  # non-frozen `uv sync` then re-resolved to whatever was newest on PyPI at run
  # time, so the linter CI ran was not the linter anyone tested with -- that is
  # the whole of #54. The uv ecosystem updates pyproject and uv.lock together.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Watches the one remaining pinned hook repo, pre-commit/pre-commit-hooks.
  # Deliberately NOT here to keep ruff current -- ruff is a `local` hook reading
  # this project's uv.lock (#56), so the `uv` ecosystem above is already its
  # only pin. Adding ruff back here would recreate the two-pin split, and pip
  # and pre-commit being separate ecosystems means the two PRs can never land
  # atomically (sandy#166 has the worked example: a weekly window of red CI).
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
