# `pre-commit install` writes the `pre-commit` hook type and nothing else unless
# this key says otherwise, so the pre-push work declared below runs on this
# machine only for as long as somebody remembers to have run
# `pre-commit install --hook-type pre-push` by hand. Declaring both types makes
# the gate a property of the repo rather than of one laptop (metaframework
# #725). `dispatch gates` reports the undeclared case as INERT or FRAGILE.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Vendored minified assets are third-party bytes, not ours. Rewriting
      # them makes the working copy differ from what upstream ships, so every
      # later uPlot bump carries a spurious whitespace diff on top of the real
      # one, forever (#104).
      #
      # The pattern says "a file under static/ whose name contains `.min.`",
      # which is the naming convention these assets already follow. It is
      # deliberately not a literal filename -- `static/` held two vendored
      # `.min` assets while #104 named only one, and a guard naming one file is
      # one file wide. It is deliberately not an extension list either: the
      # ordinary next uPlot bump brings `.min.js.map` beside the bundle, and an
      # `(css|js)$` list silently stops covering it. `.*` spans `/`, so a later
      # `static/vendor/` layout is covered without a second edit.
      #
      # The anchor is load-bearing. Both hooks below normalise whitespace over
      # the same bytes, so a second literal here is a second thing to keep in
      # step; `tests/test_precommit_vendored_excludes.py` asserts the two
      # resolve to the same pattern either way.
      - id: trailing-whitespace
        exclude: &vendored_minified ^static/.*\.min\.
      - id: end-of-file-fixer
        exclude: *vendored_minified
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
  - repo: local
    hooks:
      # ruff comes from THIS project's uv.lock, not from a pinned
      # ruff-pre-commit rev (#56). Two pins for one tool is two versions: the
      # rev said v0.15.6 while uv.lock said 0.16.0, and asking each binary
      # directly confirmed pre-commit really was running 0.15.6 -- the exact
      # local-green / CI-red split #54 cost four blocked PRs to diagnose.
      #
      # `--frozen` installs exactly what the lock pins and never re-resolves,
      # so a commit cannot silently rewrite uv.lock. (CI uses `uv lock --check`
      # + `uv sync --frozen`, which is the same guarantee from the other end.)
      #
      # The trade, taken deliberately: this gives up pre-commit's isolated hook
      # environment and needs `uv` on PATH. The radon hook below is already
      # `language: system`, so that is not a new requirement here.
      - id: ruff
        name: ruff check
        language: system
        entry: uv run --frozen ruff check --fix
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --frozen ruff format
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: radon-complexity
        name: Radon complexity gate (no block at grade C or worse)
        language: system
        entry: scripts/radon-gate.sh
        pass_filenames: false
        types: [python]
