[project]
name = "awairelement"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "astral>=3.2",
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.15.22",
]

[tool.ruff.lint]
# Pinned deliberately, because leaving it unset means the vendor picks it.
#
# This project had no [tool.ruff] section at all, so it inherited ruff's default
# rule set -- which changed underneath it. ruff 0.15.21 defaulted to
# ["E4", "E7", "E9", "F"]; 0.16.0 replaced that with a substantially wider set,
# and the first CI run to install 0.16 reported 33 errors across four Dependabot
# PRs that had touched no Python at all (#54).
#
# We adopt the rules that change surfaced, rather than suppressing them -- they
# are good ones and 31 of the 33 were mechanical autofixes. Matches the fleet
# convention (sandy pins select = ["E", "F", "C90"]).
#
# What this does and does not buy: `select` takes PREFIXES, so rules ruff adds
# to B, RUF, UP, I or F in a future release still fire automatically. This
# narrows the blast radius from 0.16's default of ~413 rules across 39 families
# to ~193 across 6 -- it is not immunity. The thing that actually makes CI
# reproducible is the version pinned in uv.lock, enforced by the `uv lock
# --check` step and `--frozen`. Don't go looking here when the next one bites.
#
#   E4/E7/E9, F  pycodestyle + pyflakes  -- the historic default
#   I            import sorting
#   UP           pyupgrade (this repo is py3.13; datetime.UTC over timezone.utc)
#   B            bugbear
#   RUF          ruff-specific
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

# Ambiguous-unicode checks. This is a sensor project: its comments, docstrings
# and strings legitimately carry scientific notation -- `±1 ppm`, `6×floor(50)`,
# `µg/m³`, `°C`. RUF003 flagged the MULTIPLICATION SIGN in a CO2 arithmetic
# comment as a suspected `x` typo, which it is not. Rewriting correct notation to
# satisfy a homoglyph check is the wrong trade in this codebase.
#
# RUF001 (string literals) is deliberately NOT ignored. It is the member of the
# trio that catches real bugs -- a Cyrillic `а` in a dict key or a non-breaking
# hyphen in a SQL identifier fails at runtime, silently -- and it was firing on
# nothing here. Only comments (RUF003) and docstrings (RUF002) get the pass.
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.isort]
# Without this, an aliased member forces a SECOND `from awair.fans import (...)`
# block directly under the first, which reads as a bad merge conflict resolution.
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=awair --cov-report=term-missing"

[tool.coverage.run]
source = ["awair"]

[tool.radon]
cc_min = "B"
